<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quản Trị Khách Mời · Tùng &amp; Lan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap&subset=vietnamese">
<style>
/* Layout: a working guest ledger for the couple: totals first, then a filterable list of guests with delivery tick-offs. */
:root {
  --ground: #f6eef0;
  --paper: #ffffff;
  --rose: #c0406b;
  --rose-soft: #ecc6d2;
  --ink: #3f3236;
  --muted: #8d7c81;
  --ok: #3d8a5a;
  --ok-soft: #e3f1e8;
  --warn: #b7791f;
  --warn-soft: #fbf0dc;
  --f-display: "Playfair Display", Georgia, serif;
  --f-body: "Be Vietnam Pro", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 14.5px/1.55 var(--f-body);
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 600 26px/1.2 var(--f-display); color: var(--rose); }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px;
  font: 500 13px/1 var(--f-body); cursor: pointer; text-decoration: none;
  border: 1px solid var(--rose); background: var(--rose); color: #fff;
}
.btn.ghost { background: var(--paper); color: var(--rose); }
.btn.small { padding: 6px 10px; font-size: 12.5px; }
.btn.danger { background: var(--paper); color: #b42318; border-color: #f0b8b3; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--paper); border-radius: 14px; padding: 14px 16px; }
.stat b { display: block; font: 600 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.main b { color: var(--rose); }
.panel { background: var(--paper); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 15px; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="search"], input[type="text"], textarea {
  font: 400 14px/1.4 var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rose-soft); border-radius: 10px; padding: 9px 12px; min-width: 0;
}
input[type="search"] { flex: 1 1 220px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rose-soft); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 12.5px/1 var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
.list { display: flex; flex-direction: column; gap: 8px; }
.guest {
  background: var(--paper); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: start;
}
.guest.done { opacity: .62; }
.g-name { font-weight: 600; font-size: 15.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.pill.yes { background: var(--ok-soft); color: var(--ok); }
.pill.maybe { background: var(--warn-soft); color: var(--warn); }
.g-meta { color: var(--muted); font-size: 13px; display: flex; gap: 4px 14px; flex-wrap: wrap; }
.g-meta a { color: var(--ink); font-weight: 500; text-decoration: none; font-variant-numeric: tabular-nums; }
.g-addr { font-size: 13.5px; overflow-wrap: anywhere; }
.g-count { text-align: right; }
.g-count b { font: 600 24px/1 var(--f-display); color: var(--rose); font-variant-numeric: tabular-nums; }
.g-count span { display: block; font-size: 11.5px; color: var(--muted); }
.g-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 6px; border-top: 1px dashed var(--rose-soft); }
.tick { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.tick input { accent-color: var(--ok); width: 16px; height: 16px; }
.note { flex: 1 1 200px; font-size: 13px; padding: 6px 10px; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; background: var(--paper); border-radius: 14px; }
.status { font-size: 12.5px; color: var(--muted); }
.link-out { font-size: 13px; overflow-wrap: anywhere; background: var(--ground); border-radius: 10px; padding: 8px 12px; user-select: all; }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Khách mời Tùng &amp; Lan</h1>
      <p class="sub">Chúa Nhật 27.12.2026 · The Adora Luxury</p>
    </div>
    <div class="row">
      <a class="btn ghost" href="/" target="_blank" rel="noopener">Xem thiệp</a>
      <a class="btn" href="/api/admin/export.csv">Tải file Excel (CSV)</a>
    </div>
  </header>

  <section class="stats" aria-label="Tổng hợp">
    <div class="stat main"><b id="s-people">0</b><span>Tổng số người dự kiến</span></div>
    <div class="stat"><b id="s-yes">0</b><span>Chắc chắn đến (<span id="s-yes-p">0</span> người)</span></div>
    <div class="stat"><b id="s-maybe">0</b><span>Cố gắng sắp xếp (<span id="s-maybe-p">0</span> người)</span></div>
    <div class="stat"><b id="s-deliv">0/0</b><span>Đã gửi thiệp tận tay</span></div>
  </section>

  <section class="panel" aria-labelledby="inv-h">
    <h2 id="inv-h">Tạo link mời riêng</h2>
    <div class="row">
      <input type="text" id="inv-name" placeholder="Ví dụ: Bạn Huy Anh, Anh Chị Minh Hà" maxlength="60" style="flex:1 1 240px">
      <button class="btn" type="button" id="inv-make">Tạo link</button>
    </div>
    <div class="row" id="inv-out" hidden>
      <span class="link-out" id="inv-link"></span>
      <button class="btn small ghost" type="button" id="inv-copy">Sao chép</button>
    </div>
  </section>

  <section class="panel" aria-label="Danh sách">
    <div class="row">
      <input type="search" id="q" placeholder="Tìm tên, số điện thoại, địa chỉ">
    </div>
    <div class="chips" role="group" aria-label="Lọc">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="chip" type="button" data-f="yes" aria-pressed="false">Chắc chắn đến</button>
      <button class="chip" type="button" data-f="maybe" aria-pressed="false">Cố gắng sắp xếp</button>
      <button class="chip" type="button" data-f="todo" aria-pressed="false">Chưa gửi thiệp</button>
    </div>
    <p class="status" id="status">Đang tải danh sách…</p>
  </section>

  <div class="list" id="list"></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let all = [], filter = "all", confirmId = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = iso => new Date(iso).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Ho_Chi_Minh" });
  const telHref = p => "tel:" + String(p).replace(/[^0-9+]/g, "");

  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Lỗi " + res.status);
    return res.json();
  }

  async function load() {
    try {
      all = await api("/api/admin/rsvps");
      render();
      $("status").textContent = `Cập nhật lúc ${new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })} · tự làm mới mỗi 30 giây`;
    } catch (e) {
      $("status").textContent = "Chưa tải được danh sách: " + e.message + ". Kiểm tra mạng rồi tải lại trang.";
    }
  }

  function stats() {
    const yes = all.filter(r => r.attend === "yes"), maybe = all.filter(r => r.attend !== "yes");
    const sum = l => l.reduce((n, r) => n + (Number(r.count) || 0), 0);
    $("s-people").textContent = sum(all);
    $("s-yes").textContent = yes.length; $("s-yes-p").textContent = sum(yes);
    $("s-maybe").textContent = maybe.length; $("s-maybe-p").textContent = sum(maybe);
    $("s-deliv").textContent = `${all.filter(r => r.delivered).length}/${all.length}`;
  }

  function render() {
    stats();
    const q = $("q").value.trim().toLowerCase();
    const rows = all
      .filter(r => filter === "all" || (filter === "yes" && r.attend === "yes") || (filter === "maybe" && r.attend !== "yes") || (filter === "todo" && !r.delivered))
      .filter(r => !q || [r.name, r.phone, r.address, r.invitedAs, r.note].join(" ").toLowerCase().includes(q))
      .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    if (!all.length) {
      $("list").innerHTML = `<div class="empty">Chưa có khách nào xác nhận. Gửi link thiệp cho khách, khi họ bấm "Gửi xác nhận" tên sẽ hiện ở đây.</div>`;
      return;
    }
    if (!rows.length) { $("list").innerHTML = `<div class="empty">Không có khách nào khớp với bộ lọc.</div>`; return; }
    $("list").innerHTML = rows.map(r => `
      <article class="guest ${r.delivered ? "done" : ""}" data-id="${esc(r.id)}">
        <div>
          <div class="g-name">${esc(r.name)} <span class="pill ${r.attend === "yes" ? "yes" : "maybe"}">${r.attend === "yes" ? "Chắc chắn đến" : "Cố gắng sắp xếp"}</span></div>
          <div class="g-meta"><a href="${esc(telHref(r.phone))}">${esc(r.phone)}</a><span>Gửi lúc ${esc(fmt(r.updatedAt))}</span>${r.invitedAs && r.invitedAs !== "Quý Khách" ? `<span>Mời: ${esc(r.invitedAs)}</span>` : ""}</div>
          <div class="g-addr">${esc(r.address)}</div>
        </div>
        <div class="g-count"><b>${esc(r.count)}</b><span>người</span></div>
        <div class="g-actions">
          <label class="tick"><input type="checkbox" data-act="deliver" ${r.delivered ? "checked" : ""}> Đã gửi thiệp</label>
          <input type="text" class="note" data-act="note" value="${esc(r.note)}" placeholder="Ghi chú (bàn số, quà…)" maxlength="300" aria-label="Ghi chú cho ${esc(r.name)}">
          ${confirmId === r.id
            ? `<span class="status">Xóa khách này?</span><button class="btn small danger" type="button" data-act="del-yes">Xóa</button><button class="btn small ghost" type="button" data-act="del-no">Giữ lại</button>`
            : `<button class="btn small danger" type="button" data-act="del">Xóa</button>`}
        </div>
      </article>`).join("");
  }

  $("list").addEventListener("change", async e => {
    const card = e.target.closest(".guest"); if (!card) return;
    const id = card.dataset.id, r = all.find(x => x.id === id);
    try {
      if (e.target.dataset.act === "deliver") { r.delivered = e.target.checked; await api("/api/admin/rsvps/" + id, { method: "PATCH", body: JSON.stringify({ delivered: r.delivered }) }); render(); }
      if (e.target.dataset.act === "note") { r.note = e.target.value; await api("/api/admin/rsvps/" + id, { method: "PATCH", body: JSON.stringify({ note: r.note }) }); }
    } catch (err) { $("status").textContent = "Chưa lưu được: " + err.message; }
  });
  $("list").addEventListener("click", async e => {
    const act = e.target.dataset?.act; const card = e.target.closest(".guest"); if (!act || !card) return;
    const id = card.dataset.id;
    if (act === "del") { confirmId = id; render(); }
    if (act === "del-no") { confirmId = null; render(); }
    if (act === "del-yes") {
      try { await api("/api/admin/rsvps/" + id, { method: "DELETE" }); all = all.filter(x => x.id !== id); confirmId = null; render(); }
      catch (err) { $("status").textContent = "Chưa xóa được: " + err.message; }
    }
  });

  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    filter = c.dataset.f;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
    render();
  }));
  $("q").addEventListener("input", render);

  // Link mời riêng: thiệp sẽ ghi đúng tên khách
  $("inv-make").addEventListener("click", () => {
    const name = $("inv-name").value.trim();
    if (!name) { $("inv-name").focus(); return; }
    $("inv-link").textContent = location.origin + "/#ten=" + encodeURIComponent(name);
    $("inv-out").hidden = false;
  });
  $("inv-copy").addEventListener("click", () => {
    const t = $("inv-link").textContent, b = $("inv-copy");
    const ok = () => { b.textContent = "Đã sao chép"; setTimeout(() => b.textContent = "Sao chép", 1500); };
    navigator.clipboard?.writeText(t).then(ok, () => {});
  });

  load();
  setInterval(() => { if (!document.hidden && !document.activeElement?.matches?.(".note")) load(); }, 30000);
})();
</script>
</body>
</html>
